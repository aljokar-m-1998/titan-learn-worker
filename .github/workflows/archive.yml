name: archive VOA media into the dataset

# Runs off this machine and off the Titan Gateway: GitHub's own runners pull from VOA,
# verify MIME + size + SHA-256, upload to the dataset, re-verify remotely, then purge.
# Audio and video run sequentially in ONE job because they share `_worker/media_index.json`;
# two parallel writers would overwrite each other's resume state.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      kinds:
        description: "which media to archive this run"
        required: false
        default: "audio,video"
        type: choice
        options:
          - audio,video
          - audio
          - video
      commit_files:
        description: "distinct objects per commit (state rides along in the same commit)"
        required: false
        default: "90"

concurrency:
  group: voa-media-archiver
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    defaults:
      # the default shell hides a pipeline's left-hand failure: `python … | tee` would
      # report success even when the archiver died with a traceback
      run:
        shell: bash
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_LEARN_DATASET_REPO: ${{ vars.HF_LEARN_DATASET_REPO || 'M-hv1/Titan-Learn' }}
      HF_LEARN_DATASET_REVISION: ${{ vars.HF_LEARN_STATE_REVISION || 'staging' }}
      HF_LEARN_DATASET_PIN: ${{ vars.HF_LEARN_RECORDS_PIN || 'c1680e48da3963d1f24196da26b02a4152982f0e' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install only what the archiver needs
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          # pinned to the version this worker was actually tested against; a silent major
          # bump in the hub client is not something an archival run should discover itself
          python -m pip install --no-cache-dir "huggingface_hub>=1.31,<2" "pyarrow>=15"

      - name: prove the token and the pinned records are readable
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = os.environ["HF_LEARN_DATASET_REPO"]
          pin = os.environ["HF_LEARN_DATASET_PIN"]
          info = api.repo_info(repo, repo_type="dataset")
          print("repo", repo, "private", info.private)
          path = hf_hub_download(repo_id=repo, repo_type="dataset", filename="manifest.json",
                                 revision=pin, token=os.environ["HF_TOKEN"], cache_dir="/tmp/hfc")
          manifest = json.loads(Path(path).read_text(encoding="utf-8"))
          print("records at pin:", manifest["accepted"], "| shards", len(manifest["shards"]),
                "|", manifest["format"], "| round_trip", manifest["round_trip"]["round_trip_identical"])
          PY

      - name: archive audio (one commit per ~90 objects, state inside it)
        if: ${{ github.event.inputs.kinds != 'video' }}
        run: |
          python worker.py --kind audio \
            --commit-files "${{ github.event.inputs.commit_files || '90' }}" --batches 40 \
            --workers 8 --max-minutes 118 --reserve-minutes 15 \
            --min-commit-interval 20 --min-remaining 150 \
            --max-commits-per-run "${{ vars.MAX_COMMITS_PER_RUN || '30' }}" \
            --max-commits-per-day "${{ vars.MAX_COMMITS_PER_DAY || '120' }}" | tee audio-run.json

      - name: sweep audio (bounded, between batches; the full sweep runs at completion)
        if: ${{ github.event.inputs.kinds != 'video' }}
        run: |
          python verify_media.py --kind audio --recent 500 | tee audio-verify.json
        # a non-zero exit here means an indexed object is absent or differs remotely,
        # which stops the job before any video bytes get pulled

      - name: archive video (needs the size sample AND audio verified + drained)
        if: ${{ github.event.inputs.kinds != 'audio' }}
        run: |
          python worker.py --kind video \
            --commit-files 60 --batches 40 \
            --workers 6 --max-minutes 100 --reserve-minutes 15 \
            --min-commit-interval 30 --min-remaining 200 \
            --max-commits-per-run "${{ vars.MAX_COMMITS_PER_RUN || '25' }}" \
            --max-commits-per-day "${{ vars.MAX_COMMITS_PER_DAY || '120' }}" | tee video-run.json

      - name: sweep video independently (publishes reports/video_verify.json)
        if: ${{ github.event.inputs.kinds != 'audio' }}
        run: |
          python verify_media.py --kind video --recent 150 | tee video-verify.json

      - name: upload this run's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-run-${{ github.run_number }}
          path: |
            audio-run.json
            audio-verify.json
            video-run.json
            video-verify.json
          if-no-files-found: ignore

      - name: show where the queue stands
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from huggingface_hub import hf_hub_download
          repo = os.environ["HF_LEARN_DATASET_REPO"]
          path = hf_hub_download(repo_id=repo, repo_type="dataset", filename="_worker/media_index.json",
                                 revision=os.environ["HF_LEARN_DATASET_REVISION"], token=os.environ["HF_TOKEN"],
                                 cache_dir="/tmp/hfc")
          index = json.load(open(path, encoding="utf-8"))
          from collections import Counter
          print("objects archived:", len(index["objects"]))
          print("bytes:", round(sum(o["bytes"] for o in index["objects"].values()) / 1073741824, 2), "GB")
          print("assets by status:", dict(Counter(a["status"] for a in index["assets"].values())))
          PY
